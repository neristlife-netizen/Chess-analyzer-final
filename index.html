<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Analyzer</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Arial,sans-serif;
    background:#111827;
    color:#fff;
}

body{
    overflow-x:hidden;
}

header{
    width:100%;
    padding:18px 15px;
    text-align:center;
    background:#1f2937;
}

header h1{
    margin:0;
    font-size:clamp(24px,6vw,38px);
}

header p{
    margin:7px 0 0;
    color:#cbd5e1;
}

main{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:20px 12px 40px;
}

.board-wrapper{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

#board{
    width:min(92vw,560px);
    height:min(92vw,560px);
    max-width:560px;
    max-height:560px;
    display:grid;
    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);
    border:4px solid #374151;
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.4);
}

.square{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:clamp(28px,9vw,64px);
    cursor:pointer;
    user-select:none;
}

.light{background:#f0d9b5}
.dark{background:#b58863}

.selected{
    outline:4px solid #facc15;
    outline-offset:-4px;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-top:20px;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 16px;
    background:#2563eb;
    color:white;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.info{
    margin-top:20px;
    padding:16px;
    background:#1f2937;
    border-radius:10px;
    text-align:center;
}

a{
    color:#93c5fd;
}
</style>
</head>

<body>

<header>
    <h1>♟ Chess Analyzer</h1>
    <p>Play, analyze and customize your board.</p>
</header>

<main>

<div class="board-wrapper">
    <div id="board"></div>
</div>

<div class="controls">
    <button onclick="resetBoard()">Reset Board</button>
    <button onclick="window.location.href='Customisation.html'">
        Customize
    </button>
</div>

<div class="info">
    <p id="status">White to move</p>
    <p>Tap a piece, then tap its destination square.</p>
</div>

</main>

<script>
const pieces = {
    whiteKing:"♔",
    whiteQueen:"♕",
    whiteRook:"♖",
    whiteBishop:"♗",
    whiteKnight:"♘",
    whitePawn:"♙",
    blackKing:"♚",
    blackQueen:"♛",
    blackRook:"♜",
    blackBishop:"♝",
    blackKnight:"♞",
    blackPawn:"♟"
};

let board = [
    ["♜","♞","♝","♛","♚","♝","♞","♜"],
    ["♟","♟","♟","♟","♟","♟","♟","♟"],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["♙","♙","♙","♙","♙","♙","♙","♙"],
    ["♖","♘","♗","♕","♔","♗","♘","♖"]
];

let selected = null;
let whiteTurn = true;

const boardElement = document.getElementById("board");

function drawBoard(){
    boardElement.innerHTML = "";

    for(let row=0;row<8;row++){
        for(let col=0;col<8;col++){

            const square=document.createElement("div");

            square.className =
                "square " + ((row+col)%2===0 ? "light":"dark");

            if(selected &&
               selected.row===row &&
               selected.col===col){
                square.classList.add("selected");
            }

            square.textContent=board[row][col];

            square.addEventListener("click",()=>{
                handleSquare(row,col);
            });

            boardElement.appendChild(square);
        }
    }
}

function handleSquare(row,col){

    const piece=board[row][col];

    if(selected){

        board[row][col]=board[selected.row][selected.col];
        board[selected.row][selected.col]="";

        selected=null;
        whiteTurn=!whiteTurn;

        document.getElementById("status").textContent =
            whiteTurn ? "White to move" : "Black to move";

        drawBoard();
        return;
    }

    if(piece!==""){
        selected={row,col};
        drawBoard();
    }
}

function resetBoard(){

    board=[
        ["♜","♞","♝","♛","♚","♝","♞","♜"],
        ["♟","♟","♟","♟","♟","♟","♟","♟"],
        ["","","","","","","",""],
        ["","","","","","","",""],
        ["","","","","","","",""],
        ["","","","","","","",""],
        ["♙","♙","♙","♙","♙","♙","♙","♙"],
        ["♖","♘","♗","♕","♔","♗","♘","♖"]
    ];

    selected=null;
    whiteTurn=true;

    document.getElementById("status").textContent="White to move";

    drawBoard();
}

drawBoard();
</script>

</body>
</html>
